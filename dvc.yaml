# DVC Pipeline Definition
# Defines the DAG of data processing and training stages.
# Run with: dvc repro

stages:
  ingest:
    cmd: python -m src.data.ingest --output data/raw
    deps:
      - src/data/ingest.py
    outs:
      - data/raw

  validate:
    cmd: python -m src.data.validate --data-dir data/raw
    deps:
      - src/data/validate.py
      - data/raw
    metrics:
      - logs/validation_report.json:
          cache: false

  preprocess:
    cmd: python -m src.data.preprocess --config configs/train_config.yaml
    deps:
      - src/data/preprocess.py
      - data/raw
      - configs/train_config.yaml
    outs:
      - data/processed
      - data/splits

  train:
    cmd: python -m src.training.train --config configs/train_config.yaml
    deps:
      - src/training/train.py
      - src/training/models.py
      - src/training/dataset.py
      - data/splits
      - configs/train_config.yaml
    outs:
      - models/best_resnet18.pt
    metrics:
      - docs/experiment_results.json:
          cache: false

  export:
    cmd: python -m src.serving.export_model --checkpoint models/best_resnet18.pt --format torchscript
    deps:
      - src/serving/export_model.py
      - models/best_resnet18.pt
    outs:
      - models/model_scripted.pt
